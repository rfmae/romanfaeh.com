name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  website-quality:
    name: Website quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm from package.json
        uses: pnpm/action-setup@v5

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Astro, TypeScript and lint
        run: pnpm run check

      - name: Check formatting
        run: pnpm run format:check

      - name: Build website and search index
        run: pnpm run build
